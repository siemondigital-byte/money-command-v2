  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2Fstyle>\n<style>/* The Money Command — Design System (Variante B · v3) — shared tokens & atoms */\n:root {\n  --bg:        #0a0a0f;\n  --surface:   #13131a;\n  --surface2:  #1c1c27;\n  --border:    rgba(255,255,255,0.07);\n  --border-2:  rgba(255,255,255,0.04);\n\n  --accent:    #7fffb2;\n  --accent-d:  #4ecf8a;\n  --accent2:   #4dd9ff;\n  --gold:      #ffd166;\n  --danger:    #ff6b6b;\n\n  --text:      #f0f0f8;\n  --text-2:    #b9b9c8;\n  --muted:     #6b6b80;\n  --muted-2:   #45455a;\n\n  --r-4: 4px;\n  --r-8: 8px;\n  --r-12: 12px;\n  --r-16: 16px;\n  --r-20: 20px;\n  --r-pill: 100px;\n\n  --display: 'Syne', system-ui, sans-serif;\n  --sans:    'Inter', system-ui, -apple-system, sans-serif;\n  --mono:    'DM Mono', ui-monospace, monospace;\n}\n.tmc, .tmc * { box-sizing: border-box; }\n.tmc { font-family: var(--mono); color: var(--text); }\n.tmc .display { font-family: var(--display); font-weight: 800; letter-spacing: -0.02em; color: var(--text); line-height: 1; }\n.tmc .mono { font-family: var(--mono); }\n.tmc .upper { text-transform: uppercase; letter-spacing: 0.2em; }\n.tmc .mint  { color: var(--accent); }\n.tmc .sky   { color: var(--accent2); }\n.tmc .gold  { color: var(--gold); }\n.tmc .danger{ color: var(--danger); }\n.tmc .text-2{ color: var(--text-2); }\n.tmc .muted { color: var(--muted); }\n\n/* — Hero stage (1440 × 860 typical) — */\n.tmc-hero {\n  width: 100%;\n  height: 100%;\n  background: var(--bg);\n  color: var(--text);\n  font-family: var(--mono);\n  position: relative;\n  overflow: hidden;\n}\n.tmc-hero::before {\n  content: '';\n  position: absolute; inset: 0; pointer-events: none; z-index: 0;\n  background-image:\n    linear-gradient(rgba(127,255,178,0.025) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(127,255,178,0.025) 1px, transparent 1px);\n  background-size: 40px 40px;\n}\n.tmc-hero > .glow-tr {\n  position: absolute; top: -260px; right: -180px; width: 720px; height: 720px;\n  border-radius: 50%;\n  background: radial-gradient(circle, rgba(127,255,178,0.08) 0%, transparent 70%);\n  pointer-events: none; z-index: 0;\n}\n.tmc-hero > .glow-bl {\n  position: absolute; bottom: -320px; left: -220px; width: 720px; height: 720px;\n  border-radius: 50%;\n  background: radial-gradient(circle, rgba(77,217,255,0.05) 0%, transparent 70%);\n  pointer-events: none; z-index: 0;\n}\n.tmc-hero > .stage { position: relative; z-index: 1; width: 100%; height: 100%; padding: 56px 72px; display: flex; flex-direction: column; }\n\n/* Top bar */\n.tmc-topbar {\n  display: flex; justify-content: space-between; align-items: center;\n  border-bottom: 1px solid var(--border); padding-bottom: 22px; margin-bottom: 0;\n  flex: 0 0 auto;\n}\n.tmc-brand {\n  font-family: var(--display); font-weight: 800; letter-spacing: -0.02em;\n  color: var(--text); font-size: 18px; display: flex; align-items: center; gap: 12px;\n}\n.tmc-brand .dot { width:10px; height:10px; border-radius:50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }\n.tmc-status { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; display: flex; gap: 24px; align-items: center; }\n.tmc-status .led { display: inline-block; width:6px; height:6px; border-radius:50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); margin-right: 8px; vertical-align: middle; }\n\n/* Footer */\n.tmc-footbar {\n  display: flex; justify-content: space-between; align-items: center;\n  border-top: 1px solid var(--border); padding-top: 18px; margin-top: auto;\n  flex: 0 0 auto;\n  font-family: var(--mono); font-size: 10px; color: var(--muted);\n  letter-spacing: 0.2em; text-transform: uppercase;\n}\n\n/* — Pill — */\n.tmc .pill {\n  display:inline-flex; align-items: center; gap: 10px;\n  font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;\n  color: var(--accent); text-transform: uppercase;\n  border: 1px solid rgba(127,255,178,0.3);\n  padding: 6px 14px; border-radius: var(--r-pill); background: transparent;\n}\n.tmc .pill .led { width:6px; height:6px; border-radius:50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }\n.tmc .pill.gold  { color: var(--gold);  border-color: rgba(255,209,102,0.3); }\n.tmc .pill.gold  .led { background: var(--gold);  box-shadow: 0 0 8px var(--gold); }\n.tmc .pill.coral { color: var(--danger); border-color: rgba(255,107,107,0.3); }\n.tmc .pill.coral .led { background: var(--danger); box-shadow: 0 0 8px var(--danger); }\n.tmc .pill.sky   { color: var(--accent2); border-color: rgba(77,217,255,0.3); }\n.tmc .pill.sky   .led { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }\n\n/* — Buttons — */\n.tmc .btn-mint {\n  display:inline-flex; align-items:center; gap: 14px;\n  background: var(--accent); color: #06190E; font-family: var(--display); font-weight: 700; font-size: 15px;\n  padding: 16px 28px; border-radius: var(--r-pill); border: none; cursor: pointer;\n  letter-spacing: -0.005em;\n  box-shadow: 0 0 0 1px rgba(127,255,178,.3), 0 0 32px rgba(127,255,178,.45), inset 0 1px 0 rgba(255,255,255,.18);\n}\n.tmc .btn-mint .arr { font-family: var(--mono); font-size: 14px; opacity:.75; font-weight: 400; }\n\n.tmc .btn-ghost {\n  display:inline-flex; align-items:center; gap: 14px;\n  background: transparent; color: var(--accent); font-family: var(--display); font-weight: 600; font-size: 15px;\n  padding: 15px 26px; border-radius: var(--r-pill); border: 1px solid rgba(127,255,178,0.35); cursor: pointer;\n  letter-spacing: -0.005em;\n}\n.tmc .btn-ghost .arr { font-family: var(--mono); font-size: 14px; opacity: .8; font-weight: 400; }\n\n/* — Price block — */\n.tmc .price-block { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-16); padding: 28px 32px; position: relative; overflow: hidden; }\n.tmc .price-block::before { content:\"\"; position:absolute; top:0; left:0; right:0; height: 2px; background: var(--accent); }\n.tmc .price-block .head { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }\n.tmc .price-block .strike { display:inline-flex; align-items: baseline; position: relative; color: var(--muted); font-family: var(--display); font-weight: 700; font-size: 44px; letter-spacing: -0.03em; line-height: 1; }\n.tmc .price-block .strike::after { content:\"\"; position:absolute; left: -4px; right: -4px; top: 56%; height: 1px; background: var(--accent); }\n.tmc .price-block .strike .u { font-size: 15px; font-family: var(--mono); font-weight: 400; letter-spacing: 0.04em; margin-right: 8px; color: var(--muted); align-self: center; }\n.tmc .price-block .now { display:flex; align-items: baseline; gap: 14px; margin-top: 6px; }\n.tmc .price-block .now .u { font-size: 22px; font-family: var(--mono); font-weight: 500; letter-spacing: 0.04em; color: var(--accent); }\n.tmc .price-block .now .n { font-family: var(--display); font-weight: 800; letter-spacing: -0.05em; font-size: 140px; line-height: 0.85; color: var(--accent); text-shadow: 0 0 36px rgba(127,255,178,.4); }\n.tmc .price-block .foot { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); display:flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; }\n.tmc .price-block .foot .lab { color: var(--accent); }\n.tmc .price-block .foot .rgt { color: var(--muted); }\n\n/* — KPI Strip — */\n.tmc .kpi-strip { display:grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--r-16); overflow: hidden; }\n.tmc .kpi-strip .ki { background: var(--surface); padding: 18px 22px; position: relative; }\n.tmc .kpi-strip .ki::before { content:\"\"; position: absolute; top: 0; left: 0; right: 0; height: 2px; }\n.tmc .kpi-strip .ki.k::before { background: var(--accent2); }\n.tmc .kpi-strip .ki.i::before { background: var(--accent); }\n.tmc .kpi-strip .ki.b::before { background: var(--gold); }\n.tmc .kpi-strip .lab { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }\n.tmc .kpi-strip .num { font-family: var(--display); font-weight: 800; letter-spacing: -0.03em; font-size: 32px; line-height: 1; margin-top: 12px; }\n.tmc .kpi-strip .ki.k .num { color: var(--accent2); }\n.tmc .kpi-strip .ki.i .num { color: var(--accent); }\n.tmc .kpi-strip .ki.b .num { color: var(--gold); }\n.tmc .kpi-strip .ctx { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 8px; }\n\n/* — Chart bars (outline) — */\n.tmc .chart-wrap { position: relative; padding-left: 42px; padding-bottom: 24px; }\n.tmc .chart-wrap .y-axis { position: absolute; left:0; top:-4px; bottom: 24px; width: 36px; display:flex; flex-direction: column; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--muted); }\n.tmc .chart-wrap .y-axis span { text-align: right; padding-right: 8px; line-height: 1; }\n.tmc .chart-wrap .plot { position: relative; height: 100%; display:flex; align-items: flex-end; gap: 6px; padding: 0 2px; }\n.tmc .chart-wrap .plot::before, .tmc .chart-wrap .plot::after, .tmc .chart-wrap .plot > .gridline { content:\"\"; position: absolute; left:0; right:0; height:1px; background: rgba(255,255,255,0.04); pointer-events: none; }\n.tmc .chart-wrap .plot::before { top: 25%; }\n.tmc .chart-wrap .plot::after  { top: 50%; }\n.tmc .chart-wrap .plot > .gridline { top: 75%; }\n.tmc .chart-wrap .bar-col { flex: 1; height: 100%; display:flex; flex-direction: column; justify-content: flex-end; }\n.tmc .chart-wrap .bar-col .seg { width: 100%; border-radius: 2px 2px 0 0; }\n.tmc .chart-wrap .bar-col .seg.k { background: rgba(77,217,255,0.13); border: 1px solid var(--accent2); border-bottom: 0; }\n.tmc .chart-wrap .bar-col .seg.i { background: rgba(127,255,178,0.20); border: 1px solid var(--accent); border-bottom: 0; }\n.tmc .chart-wrap .xlabels { position: absolute; left: 42px; right: 0; bottom: 4px; display:flex; gap: 6px; padding: 0 2px; }\n.tmc .chart-wrap .xlabels span { flex:1; text-align: center; font-family: var(--mono); font-size: 10px; color: var(--muted); }\n\n/* — Card surfaces — */\n.tmc .card {\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: var(--r-20); padding: 28px; position: relative; overflow: hidden;\n}\n.tmc .card.top-mint::before, .tmc .card.top-sky::before, .tmc .card.top-gold::before, .tmc .card.top-coral::before {\n  content: ''; position: absolute; top:0; left:0; right:0; height: 2px;\n}\n.tmc .card.top-mint::before { background: var(--accent); }\n.tmc .card.top-sky::before  { background: var(--accent2); }\n.tmc .card.top-gold::before { background: var(--gold); }\n.tmc .card.top-coral::before{ background: var(--danger); }\n\n/* — Sliders — */\n.tmc .slider .lbl { display:flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }\n.tmc .slider .val { font-family: var(--display); font-weight: 800; color: var(--accent); font-size: 32px; letter-spacing: -0.03em; margin-top: 8px; }\n.tmc .slider .val .u { font-family: var(--mono); font-size: 14px; font-weight: 400; color: var(--accent); margin-right: 4px; opacity: 0.8; vertical-align: 6px; }\n.tmc .slider .track { position: relative; height: 2px; border-radius: 2px; margin: 18px 0 10px; }\n.tmc .slider .handle { position:absolute; top: 50%; transform: translate(-50%,-50%); width: 16px; height: 16px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px rgba(127,255,178,.5); }\n.tmc .slider .ticks { display:flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--muted); }\n<\u002Fstyle>\n<style>\n  /* ─── Page chrome (this is a LANDING SECTION, not a full page) ─── */\n  html, body { margin: 0; padding: 0; bac
